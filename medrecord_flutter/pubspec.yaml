name: medrecord_flutter
description: A comprehensive medical records management system built with Flutter for web, iOS, and Android.
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  
  # UI and Material Design
  material_symbols_icons: ^4.2.7
  cupertino_icons: ^1.0.6
  
  # State Management
  provider: ^6.1.1
  
  # Supabase Integration
  supabase_flutter: ^2.3.4
  
  # HTTP and Network
  http: ^1.1.2
  dio: ^5.4.0
  
  # Storage and Cache
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Image and File Handling
  image_picker: ^1.0.7
  file_picker: ^6.1.1
  image_cropper: ^5.0.1
  cached_network_image: ^3.3.1
  
  # AI and Document Analysis
  google_generative_ai: ^0.2.2
  
  # QR Code
  qr_flutter: ^4.1.0
  qr_code_scanner: ^1.0.1
  
  # Date and Time
  intl: ^0.19.0
  
  # Animations and UI Enhancements
  lottie: ^3.1.0
  shimmer: ^3.0.0
  flutter_staggered_grid_view: ^0.7.0
  
  # Utilities
  uuid: ^4.3.3
  url_launcher: ^6.2.5
  permission_handler: ^11.3.0
  device_info_plus: ^10.1.0
  package_info_plus: ^5.0.1
  
  # Charts and Graphs
  fl_chart: ^0.66.2
  
  # PDF and Document Generation
  pdf: ^3.10.7
  printing: ^5.12.0
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  
  flutter_lints: ^3.0.0
  build_runner: ^2.4.7
  hive_generator: ^2.0.1
  json_annotation: ^4.8.1
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
  
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icons/app_icon.png"